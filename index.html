<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dashboard Temperatura</title>

<!-- Flatpickr -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>

<body>

<!-- MENU MOBILE -->
<button class="menu-btn" id="menuBtn">
☰
</button>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">

<h2>🌡 Dashboard</h2>

<nav>
<button class="nav-btn active" data-page="tempo">
📈 Tempo Real
</button>

<button class="nav-btn" data-page="comparativo">
📊 Comparativo
</button>

<button id="temaBtn">
🌙 Tema
</button>
</nav>

</aside>

<!-- CONTEÚDO -->
<main class="content">

<!-- TEMPO REAL -->
<section id="tempo" class="page active">

<div class="card-title">
<h1 id="tituloHoje">Temperatura</h1>
<p>Monitoramento em tempo real</p>
</div>

<div class="cards">

<div class="info-card">
<h3>🌡 Atual</h3>
<p id="tempAtual">--°C</p>
</div>

<div class="info-card">
<h3>🔥 Máxima</h3>
<p id="tempMax">--°C</p>
</div>

<div class="info-card">
<h3>❄ Mínima</h3>
<p id="tempMin">--°C</p>
</div>

</div>

<div class="grafico-card">
<canvas id="graficoTemperatura"></canvas>
</div>

</section>

<!-- COMPARATIVO -->
<section id="comparativo" class="page">

<div class="card-title">
<h1>Comparativo</h1>
<p>Compare um intervalo completo</p>
</div>

<div class="comparativo-box">

<input
type="text"
id="intervalo"
class="calendario"
placeholder="Selecione o período">

<button id="btnComparar">
Comparar
</button>

</div>

<div class="cards">

<div class="info-card">
<h3>🔥 Temperatura mais alta</h3>
<p id="maiorTemp">--°C</p>
</div>

<div class="info-card">
<h3>❄ Temperatura mais baixa</h3>
<p id="menorTemp">--°C</p>
</div>

<div class="info-card">
<h3>📊 Média</h3>
<p id="mediaTemp">--°C</p>
</div>

</div>

<div class="grafico-card">
<canvas id="graficoComparativo"></canvas>
</div>

</section>

</main>

<script type="module" src="main.js"></script>

</body>
</html>
