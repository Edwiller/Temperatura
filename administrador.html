<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Administração | Monitoramento Térmico</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/portal.css?v=admin-1">
    <script type="module" src="./assets/js/pages/administrador.js?v=desempenho-1"></script>
</head>
<body>
    <header data-portal-header hidden></header>
    <p class="portal-acesso" data-portal-status role="status" hidden></p>
    <main class="portal-pagina" data-portal-content hidden>
        <div class="portal-titulo">
            <div>
                <h1>Administração</h1>
                <p>Aprove as solicitações das pessoas autorizadas a usar o portal.</p>
            </div>
        </div>
        <section class="portal-painel" aria-labelledby="tituloPendencias">
            <div class="portal-painel-cabecalho">
                <h2 id="tituloPendencias">Cadastros pendentes</h2>
                <button class="portal-botao portal-botao-secundario" type="button" id="atualizarPendencias">Atualizar</button>
            </div>
            <p id="estadoPendencias" class="portal-estado" role="status">Carregando solicitações...</p>
            <ul id="listaPendencias" class="portal-pendencias"></ul>
            <button class="portal-botao portal-botao-secundario" type="button" id="maisPendencias" hidden>Carregar mais</button>
        </section>
    </main>
</body>
</html>
